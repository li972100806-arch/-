name: Import Jianwu APK for analysis

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'APK direct URL or Jianwu download page URL'
        required: true
        default: 'https://www.tvmao.com/sjgame/300219.html'
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and download APK
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p work
          python3 - <<'PY'
          import re, sys, urllib.request
          from urllib.parse import urljoin
          src = sys.argv[1]
          req = urllib.request.Request(src, headers={
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          })
          with urllib.request.urlopen(req, timeout=60) as r:
              data = r.read()
              ctype = r.headers.get('Content-Type','')
              final = r.geturl()
          if data[:4] == b'PK\\x03\\x04':
              open('work/jianwu.apk','wb').write(data)
              print('Source itself is an APK:', final)
              raise SystemExit
          text = data.decode('utf-8','ignore')
          candidates=[]
          for href in re.findall(r'''(?:href|src)\\s*=\\s*["']([^"']+)["']''', text, re.I):
              u=urljoin(final, href)
              if '.apk' in u.lower() or 'download' in u.lower():
                  candidates.append(u)
          # Keep unique candidates and prefer explicit APK-looking links.
          seen=[]
          for u in candidates:
              if u not in seen: seen.append(u)
          print('Candidate download links:', len(seen))
          open('work/candidates.txt','w').write('\\n'.join(seen))
          if not seen:
              print('No download link found on source page', file=sys.stderr)
              raise SystemExit(2)
          open('work/resolved_url.txt','w').write(seen[0])
          PY
          SOURCE_URL="$SOURCE_URL" python3 - <<'PY'
          import os, urllib.request
          src=os.environ['SOURCE_URL']
          try:
              page=open('work/candidates.txt').read().splitlines()
          except FileNotFoundError:
              page=[]
          urls=page[:]
          if not urls: urls=[src]
          for u in urls:
              try:
                  print('Trying:',u)
                  req=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      data=r.read()
                  if data[:4] == b'PK\\x03\\x04' and len(data) > 1024*1024:
                      open('work/jianwu.apk','wb').write(data)
                      open('work/resolved_url.txt','w').write(u)
                      print('APK obtained:',len(data),'bytes')
                      break
              except Exception as e:
                  print('Failed:',repr(e))
          else:
              raise SystemExit('No valid APK could be downloaded from the discovered links')
          PY
          test -s work/jianwu.apk
          file work/jianwu.apk
          sha256sum work/jianwu.apk | tee work/SHA256SUMS.txt
          unzip -t work/jianwu.apk >/dev/null

      - name: Inspect APK structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -l work/jianwu.apk | tee work/apk-file-list.txt
          mkdir -p work/raw
          unzip -o work/jianwu.apk -d work/raw >/dev/null
          find work/raw -maxdepth 2 -type f | sort > work/raw-file-list.txt

      - name: Install JADX CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, zipfile, io
          api='https://api.github.com/repos/skylot/jadx/releases/latest'
          req=urllib.request.Request(api, headers={'User-Agent':'github-actions'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          asset=next(a for a in data['assets'] if a['name'].endswith('.zip') and 'latest' not in a['name'].lower())
          req=urllib.request.Request(asset['browser_download_url'], headers={'User-Agent':'github-actions'})
          with urllib.request.urlopen(req, timeout=120) as r:
              payload=r.read()
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              z.extractall('jadx')
          PY
          chmod +x jadx/jadx-*/bin/jadx

      - name: Decompile and extract manifest/resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/decompiled
          JADXBIN=$(find jadx -type f -path '*/bin/jadx' | head -n 1)
          "$JADXBIN" -d work/decompiled --show-bad-code work/jianwu.apk || true
          find work/decompiled -maxdepth 3 -type f | sort > work/decompiled-file-list.txt || true
          [ -f work/decompiled/resources/AndroidManifest.xml ] && cp work/decompiled/resources/AndroidManifest.xml work/AndroidManifest.xml || true

      - name: Upload analysis package
        uses: actions/upload-artifact@v4
        with:
          name: jianwu-analysis
          path: work/
          retention-days: 14
